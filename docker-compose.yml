version: '3.8'

services:
  # Python 실시간 프로듀서 서비스
  python-app:
    build:
      context: .
      dockerfile: producer.Dockerfile
    container_name: upanddown-python
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - redis
      - rabbitmq

  # Spring Boot 애플리케이션 서비스
  java-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upanddown-app
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
      - management.endpoints.web.exposure.include=*
      - management.endpoint.prometheus.enabled=true
      - management.metrics.distribution.percentiles-histogram.http.server.requests=true
      - management.metrics.tags.application=upanddown
    depends_on:
      - redis
      - rabbitmq

  # Redis 데이터베이스 서비스
  redis:
    image: redis:latest
    container_name: upanddown-redis
    ports:
      - "6379:6379"

  # RabbitMQ 메시지 브로커 서비스
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: upanddown-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  # Prometheus 모니터링 서비스
  prometheus:
    image: prom/prometheus:latest
    container_name: upanddown-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - java-app

  # Grafana 시각화 서비스
  grafana:
    image: grafana/grafana:latest
    container_name: upanddown-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data: {}
