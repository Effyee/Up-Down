version: '3.8'

services:
  # Spring Boot 애플리케이션 서비스
  app:
    build: .
    container_name: upanddown-app
    ports:
      - "8081:8080"
    environment:
      # `.env` 파일에서 데이터베이스 정보를 가져와 환경 변수로 설정합니다.
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - redis

  # Redis 데이터베이스 서비스
  redis:
    image: redis:latest
    container_name: upanddown-redis
    ports:
      - "6379:6379"

  # Prometheus 모니터링 서비스
  prometheus:
    image: prom/prometheus:latest
    container_name: upanddown-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - app

  # Grafana 시각화 서비스
  grafana:
    image: grafana/grafana:latest
    container_name: upanddown-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data: {}